<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idle Life approval</title>
<!-- Idle Life's Face ID approval, opened from Jack's Telegram bot (engine/phone-faceid.mjs). No secrets live here:
     the signing key is made on the phone, kept in Telegram's biometric storage and released only by Face ID. The page
     signs exactly the request it was opened for and hands the signature back to the bot with sendData. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg: var(--tg-theme-bg-color, #ffffff); --fg: var(--tg-theme-text-color, #111111); --muted: var(--tg-theme-hint-color, #6b6b6b);
          --btn: var(--tg-theme-button-color, #2481cc); --btn-fg: var(--tg-theme-button-text-color, #ffffff); --card: var(--tg-theme-secondary-bg-color, #f3f3f3); }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px 32px; background: var(--bg); color: var(--fg); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .muted { color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border-radius: 12px; padding: 12px 14px; margin: 16px 0; }
  ul { margin: 6px 0 0; padding-left: 18px; }
  li { margin: 3px 0; }
  button { width: 100%; border: 0; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 600; background: var(--btn); color: var(--btn-fg); }
  button[disabled] { opacity: 0.5; }
  #status { margin-top: 14px; min-height: 22px; }
</style>
</head>
<body>
  <h1 id="title">Idle Life</h1>
  <div class="muted" id="sub"></div>
  <div class="card" id="card" hidden><div id="what"></div><ul id="lines"></ul></div>
  <button id="go" hidden></button>
  <div class="muted" id="status"></div>
<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const mode = q.get("m"), id = q.get("id") || "", digest = q.get("d") || "", what = q.get("t") || "", nonce = q.get("n") || "";
  const lines = (q.get("l") || "").split("\n").map((s) => s.trim()).filter(Boolean).slice(0, 8);
  const say = (text) => { $("status").textContent = text; };
  const b64u = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  if (!tg || !tg.BiometricManager) { $("sub").textContent = "Open this from the Idle Life bot in Telegram."; return; }
  tg.ready(); tg.expand();
  const bm = tg.BiometricManager;
  const go = (label, fn) => { const b = $("go"); b.textContent = label; b.hidden = false; b.disabled = false; b.onclick = () => { b.disabled = true; fn().catch((e) => { say("Something went wrong: " + (e && e.message || e)); b.disabled = false; }); }; };
  const call = (fn, ...args) => new Promise((resolve) => fn.call(bm, ...args, (...out) => resolve(out)));

  async function enrol() {
    if (!bm.isAccessGranted) {
      const [granted] = await call(bm.requestAccess, { reason: "Approve Idle Life production releases with Face ID" });
      if (!granted) { say("Face ID access was not granted. Allow it in Telegram's settings, then try again."); $("go").disabled = false; return; }
    }
    const pair = await crypto.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]);
    const priv = await crypto.subtle.exportKey("jwk", pair.privateKey), pub = await crypto.subtle.exportKey("jwk", pair.publicKey);
    const [saved] = await call(bm.updateBiometricToken, JSON.stringify({ x: priv.x, y: priv.y, d: priv.d }));
    if (!saved) { say("The key could not be saved. Try again."); $("go").disabled = false; return; }
    say("Saved. Sending to Idle Life...");
    tg.sendData(JSON.stringify({ t: "enrol", n: nonce, bt: bm.biometricType || "unknown", pub: { kty: "EC", crv: "P-256", x: pub.x, y: pub.y } }));
  }

  async function approve() {
    if (!bm.isBiometricTokenSaved) { say("Face ID is not set up on this phone yet. Set it up from the menu bar first."); return; }
    const [ok, token] = await call(bm.authenticate, { reason: ("Approve: " + what).slice(0, 120) });
    if (!ok || !token) { say("Not approved."); $("go").disabled = false; return; }
    const k = JSON.parse(token);
    const key = await crypto.subtle.importKey("jwk", { kty: "EC", crv: "P-256", x: k.x, y: k.y, d: k.d, ext: true }, { name: "ECDSA", namedCurve: "P-256" }, false, ["sign"]);
    const ts = Date.now();
    const sig = await crypto.subtle.sign({ name: "ECDSA", hash: "SHA-256" }, key, new TextEncoder().encode(`idle-life-approve|${id}|${digest}|${ts}`));
    say("Approved. Sending to Idle Life...");
    tg.sendData(JSON.stringify({ t: "approve", id, d: digest, ts, sig: b64u(sig) }));
  }

  bm.init(() => {
    if (!bm.isBiometricAvailable) { $("sub").textContent = "Face ID isn't available in this Telegram app. Approve it on the Mac instead."; return; }
    if (mode === "enrol" && /^[0-9a-f]{32}$/.test(nonce)) {
      $("title").textContent = "Set up Face ID";
      $("sub").textContent = "Production releases you approve on this phone will need your face, just like Touch ID on the Mac.";
      go("Set up Face ID", enrol);
    } else if (mode === "approve" && id && /^[0-9a-f]{16}$/.test(digest)) {
      $("title").textContent = "Approve with Face ID";
      $("sub").textContent = "This approves exactly what is listed below.";
      $("what").textContent = what;
      for (const l of lines) { const li = document.createElement("li"); li.textContent = l; $("lines").appendChild(li); }
      $("card").hidden = false;
      go("Approve with Face ID", approve);
      // One tap from the chat: Face ID asks straight away; the button stays for a retry.
      $("go").click();
    } else {
      $("sub").textContent = "This link is incomplete. Open it again from the Idle Life bot.";
    }
  });
})();
</script>
</body>
</html>
